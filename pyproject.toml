[project]
name = "daily-digest-desk"
version = "0.1.0"
description = "Daily investing digest: SEC filings and market data -> grounded summaries -> Obsidian notes."
requires-python = ">=3.11"
dependencies = [
    "edgartools>=4.0",
    "pandas>=2.0",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
desk = "daily_digest_desk.main:main"
desk-collect = "daily_digest_desk.collect:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["daily_digest_desk"]
